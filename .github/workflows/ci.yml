name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Frontend lint, types, tests and build
        run: docker compose -f compose.check.yml run --build --rm frontend-check
      - name: Check shared error codes
        run: docker compose -f compose.check.yml run --rm error-catalog-check
      - name: Java tests and build
        run: docker compose -f compose.check.yml run --build --rm backend-check
      - name: Start application stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verify same-origin Java health
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/system/health
      - name: Foundation API checks
        run: docker compose --profile tools run --rm foundation-check
      - name: Asset upload and access checks
        run: docker compose --profile tools run --rm asset-check
      - name: Task pipeline checks
        run: docker compose --profile tools run --rm task-check
      - name: Application logs
        if: failure()
        run: docker compose logs --no-color
      - name: Check environment logs
        if: failure()
        run: docker compose -f compose.check.yml logs --no-color
      - name: Stop application services without deleting volumes
        if: always()
        run: docker compose down
      - name: Stop check services without deleting volumes
        if: always()
        run: docker compose -f compose.check.yml down
  session-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start two isolated sites
        run: |
          FRONTEND_PORT=3541 FRONTEND_BIND_ADDRESS=127.0.0.1 TASK_ASSET_CHECK_DELAY_MS=50 TASK_GENERATE_DELAY_MS=100 TASK_FINALIZE_DELAY_MS=50 docker compose -p xiaoying-site-a up --build -d --wait --wait-timeout 300
          FRONTEND_PORT=3542 FRONTEND_BIND_ADDRESS=127.0.0.1 TASK_ASSET_CHECK_DELAY_MS=50 TASK_GENERATE_DELAY_MS=100 TASK_FINALIZE_DELAY_MS=50 docker compose -p xiaoying-site-b up --build -d --wait --wait-timeout 300
          docker network create xiaoying-session-verification
          docker network connect xiaoying-session-verification xiaoying-site-a-frontend-1
          docker network connect xiaoying-session-verification xiaoying-site-b-frontend-1
      - name: Verify session migration and site isolation
        run: |
          docker run --rm --network xiaoying-session-verification \
            -e SITE_A=http://xiaoying-site-a-frontend-1:3000 -e SITE_B=http://xiaoying-site-b-frontend-1:3000 \
            -e ORIGIN_A=http://localhost:3541 -e ORIGIN_B=http://localhost:3542 \
            -e COOKIE_A=studio_session_3541 -e COOKIE_B=studio_session_3542 \
            -v "$PWD/checks:/checks:ro" -v "$PWD/demo-assets/uploads:/fixtures:ro" \
            node:22.14.0-bookworm-slim node /checks/session-sites.mjs
      - name: Stop isolated sites
        if: always()
        run: |
          FRONTEND_PORT=3541 docker compose -p xiaoying-site-a down
          FRONTEND_PORT=3542 docker compose -p xiaoying-site-b down
          docker network rm xiaoying-session-verification || true
